name: Deploy to InfinityFree

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate dependencies
        run: composer check-platform-reqs

      - name: Run helper tests
        run: php tests/run.php

      - name: Check PHP syntax
        shell: bash
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: vars.FTPS_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, pdo_mysql, simplexml, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /htdocs/